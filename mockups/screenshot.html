<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amazon Bedrock (Copilot Chat) — Configuration Drawer Screenshot</title>
<style>
  /* VS Code-ish frame around the real webview content (loaded via iframe below) */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #1e1e1e; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* Activity bar */
  .activitybar {
    width: 48px;
    flex: none;
    background: #181818;
    border-right: 1px solid #2a2a2a;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 4px;
  }
  .ab-item {
    width: 48px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #7a7a7a;
    position: relative;
  }
  .ab-item.active {
    color: #e8e8e8;
  }
  .ab-item.active::before {
    content: '';
    position: absolute;
    left: 0; top: 6px; bottom: 6px;
    width: 2px;
    background: #e8e8e8;
  }
  .ab-item svg { width: 22px; height: 22px; }

  /* Sidebar chrome */
  .sidebar {
    width: 380px;
    flex: none;
    background: #1e1e1e;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #2a2a2a;
  }
  .sidebar-title {
    padding: 10px 12px 6px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #a0a0aa;
  }
  .sidebar-body {
    flex: 1;
    overflow: hidden;
  }
  .sidebar-body iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* Editor area hint (empty, subtle) */
  .editor {
    flex: 1;
    background: #1e1e1e;
  }
</style>
</head>
<body>
  <div class="activitybar">

    <div class="ab-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="11" cy="11" r="5.5"/><path d="M15 15l4.5 4.5"/></svg></div>
    <div class="ab-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6"/></svg></div>
    <div class="ab-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="7"/><path d="M12 5v-2M12 21v-2M5 12H3M21 12h-2M7.5 7.5L6 6M18 18l-1.5-1.5M16.5 7.5L18 6M6 18l1.5-1.5"/></svg></div>
    <div class="ab-item active">

  <div class="sidebar">
    <div class="sidebar-title">Amazon Bedrock (Copilot Chat): Configuration</div>
    <div class="sidebar-body">
      <iframe src="./webview-content.gen.html"></iframe>
    </div>
  </div>

  <div class="editor"></div>
</body>
</html>
